# Install under /etc/nginx/sites-available and include from nginx's http context.
# Shared response cache: only the public asset location below uses it.
proxy_cache_path /var/cache/nginx/vistavilla levels=1:2
    keys_zone=vistavilla_assets:10m max_size=256m inactive=7d use_temp_path=off;

upstream vistavilla_app {
    server 127.0.0.1:9090;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name test.vistavillaapartments.org;

    ssl_certificate /etc/letsencrypt/live/test.vistavillaapartments.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.vistavillaapartments.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;

    # Cache public assets only. Cookies and authenticated requests bypass cache.
    # Upstream Set-Cookie, Cache-Control and Vary protections remain in effect.
    location ~* ^/(?:css|js|fonts|images|assets|portal/assets)/.+\.(?:css|js|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        proxy_pass http://vistavilla_app;
        proxy_cache vistavilla_assets;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization $http_cookie;
        proxy_no_cache $http_authorization $http_cookie;
        add_header X-Asset-Cache $upstream_cache_status;
    }

    # Live pages, room availability, bookings, payments and portal responses.
    location / {
        proxy_pass http://vistavilla_app;
        proxy_cache off;
    }
}

server {
    listen 80;
    server_name test.vistavillaapartments.org;
    return 301 https://test.vistavillaapartments.org$request_uri;
}
